[project]
name = "agent-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepeval>=3.9.7",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.0",
    "jieba>=0.42.1",
    "langchain>=1.2.15",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.0",
    "langchain-deepseek>=1.0.1",
    "langchain-openai>=1.1.14",
    "pymilvus[milvus-lite]>=2.6.12",
    "pypdf>=6.10.2",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "rank-bm25>=0.2.2",
    "recursivecharactertextsplitter>=0.1.0",
    "setuptools<82",
    "unstructured[html]>=0.22.23",
    "uvicorn>=0.44.0",
    "zai-sdk>=0.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort - import 排序
    "N",   # pep8-naming - 命名规范
    "B",   # flake8-bugbear - 常见 bug 检查
    "SIM", # flake8-simplify - 简化代码建议
    "UP",  # pyupgrade - 现代 Python 语法建议
]
ignore = []
fixable = ["ALL"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"
