[project]
name = "learning-agent"
version = "0.1.0"
description = "LLM Agent learning workspace"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]

[tool.uv.workspace]
members = ["study", "practice"]

[tool.uv]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "N",
    "B",
    "SIM",
    "UP",
]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"study/**" = ["E501", "E402"]
