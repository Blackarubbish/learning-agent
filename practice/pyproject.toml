[project]
name = "hello-agents-practice"
version = "0.1.0"
description = "Hands-on practice project for Hello-Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentscope>=2.0.5",
    "jupyter>=1.1.1",
    "langchain>=1.3.14",
    "langgraph>=1.2.9",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=13.6.0,<15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hello_agents_practice"]
